app:
  title: "AI画像学習・生成GUI"
  version: "0.8.0"
  server_name: "127.0.0.1"
  server_port: 7860
  share: false
  offline: true
  analytics_enabled: false

paths:
  python_executable: "%AI_MR_IMAGE_PYTHON%"
  accelerate_executable: "%AI_MR_IMAGE_ACCELERATE%"
  training_script: "vendor\\diffusers-0.41.0\\examples\\dreambooth\\train_dreambooth_lora_sdxl.py"
  generation_worker: "workers\\generate_image.py"
  preview_cache: "%AI_MR_COMMON_ROOT%\\temp\\preview"
  training_packages: "%AI_MR_TRAINING_PACKAGES%"
  datasets_cache: "%AI_MR_COMMON_ROOT%\\temp\\datasets"
  model_snapshot_root: "%AI_MR_COMMON_ROOT%\\models\\huggingface\\models--stabilityai--stable-diffusion-xl-base-1.0\\snapshots"
  workspace_root: "%AI_MR_WORKSPACE%"
  lora_root: "%AI_MR_WORKSPACE%\\lora_outputs"
  generated_root: "%AI_MR_WORKSPACE%\\generated"
  records_root: "%AI_MR_WORKSPACE%\\gui_records"
  acceptance_test_root: "%AI_MR_WORKSPACE%\\gui_records\\acceptance_tests"
  user_settings_file: "%AI_MR_WORKSPACE%\\gui_state\\user_settings.json"

ui_defaults:
  training_image_dir: "%AI_MR_WORKSPACE%\\training\\instance_images"
  training_output_dir: "%AI_MR_WORKSPACE%\\lora_outputs\\gui_experiment_001"
  training_prompt: "a photo of aimrps01 person wearing a powered suit"
  training_caption_mode: "固定プロンプト"
  training_resume_checkpoint: ""
  training_repetitions: 30
  additional_steps: 600
  target_steps: 600
  generation_lora: ""
  lora_strength: 1.0
  generation_lora_2: ""
  lora_strength_2: 0.7
  generation_lora_3: ""
  lora_strength_3: 0.7
  generation_prompt: "a full-body photo of aimrps01 person wearing a powered suit, standing in a futuristic mixed reality research room, realistic photography, detailed armor, cinematic lighting"
  generation_seed: 42
  generation_width: 512
  generation_height: 512
  generation_output_dir: "%AI_MR_WORKSPACE%\\generated\\aimrps01_gui"
  external_storage_root: ""
  archive_experiment_name: "experiment_001"
  archive_path: ""
  restore_pc_root: "%AI_MR_WORKSPACE%\\lora_outputs\\restored_experiments"

training:
  resolution: 512
  center_crop: true
  train_batch_size: 1
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  learning_rate: 1.0e-4
  lr_scheduler: "constant"
  lr_warmup_steps: 0
  checkpointing_steps: 100
  checkpoints_total_limit: 7
  mixed_precision: "fp16"
  rank: 8
  dataloader_num_workers: 0
  report_to: "tensorboard"
  seed: 42
  variant: "fp16"
  train_text_encoder: false

generation:
  width: 512
  height: 512
  steps: 30
  guidance_scale: 7.0
  negative_prompt: "illustration, anime, cartoon, low quality, blurry, distorted face, extra fingers, extra limbs"
